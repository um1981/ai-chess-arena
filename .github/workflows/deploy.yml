name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set - skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
      - run: npm install
        if: steps.check.outputs.skip != 'true'
      - run: npm run build
        if: steps.check.outputs.skip != 'true'
      - name: Deploy Worker and Capture Error
        if: steps.check.outputs.skip != 'true'
        run: |
          npx wrangler deploy > deploy_output.txt 2>&1 || true
          cat deploy_output.txt
          node -e "
            const fs = require('fs');
            const txt = fs.readFileSync('deploy_output.txt', 'utf8');
            const summary = txt.split('\n').filter(l => l.includes('ERROR') || l.includes('Error') || l.includes('code:') || l.includes('message:') || l.includes('100')).join(' | ');
            if (summary) console.log('::error::Deploy Failure Reason: ' + summary);
          "
          if grep -q "ERROR" deploy_output.txt; then exit 1; fi
      - name: Apply D1 migrations
        if: steps.check.outputs.skip != 'true'
        run: echo "y" | npx wrangler d1 migrations apply ai-chess-arena-db --remote
